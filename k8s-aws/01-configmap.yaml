# Variáveis NÃO sensíveis. DB_HOST é substituído em tempo de deploy pela
# pipeline de CI/CD com o endpoint publicado pelo oficina-infra-db no SSM
# Parameter Store (/oficina/db_endpoint) — mesma instância RDS compartilhada
# com o os-service, banco lógico distinto (ver ci.yml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-producao-app-config
  namespace: oficina-producao
data:
  NODE_ENV: 'production'
  PORT: '3001'
  DB_HOST: '__DB_ENDPOINT__'
  DB_PORT: '5432'
  DB_DATABASE: 'oficina_producao'
  DB_SSL: 'true'
  RABBITMQ_URL: 'amqp://guest:guest@oficina-rabbitmq.oficina-shared.svc.cluster.local:5672'
  NEW_RELIC_ENABLED: 'true'
  NEW_RELIC_NO_CONFIG_FILE: 'true'
  NEW_RELIC_APP_NAME: 'oficina-producao-service'
  NEW_RELIC_LOG: 'stdout'
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: 'true'
